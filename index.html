<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PNGX Candlestick Charts</title>
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
  <style>
    :root{--bg:#0f172a;--card:#111827;--text:#e5e7eb;--muted:#94a3b8;--accent:#22d3ee}
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial;background:var(--bg);color:var(--text)}
    header{padding:18px 20px;border-bottom:1px solid #1f2937;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
    header h1{margin:0;font-size:18px;letter-spacing:.3px}
    a{color:var(--accent);text-decoration:none}
    .container{max-width:1100px;margin:24px auto;padding:0 16px}
    .panel{background:var(--card);border:1px solid #1f2937;border-radius:16px;padding:16px}
    .controls{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:12px;align-items:end}
    label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}
    select,input,button{width:100%;padding:10px 12px;border:1px solid #374151;border-radius:10px;background:#0b1220;color:var(--text)}
    button{cursor:pointer;border-color:#334155}
    button.primary{background:#0ea5e9;border-color:#0284c7;color:#001018}
    #status{font-size:12px;color:var(--muted);margin-top:8px;min-height:18px}
    #chart{background:var(--card);border:1px solid #1f2937;border-radius:16px;margin-top:16px}
    .footer{opacity:.7;font-size:12px;margin-top:10px;line-height:1.4}
  </style>
</head>
<body>
  <header>
    <h1>PNGX Candlestick Charts</h1>
    <div><a href="https://github.com/chrisaugu/pngx-api" target="_blank" rel="noreferrer">Powered by NUKU API</a></div>
  </header>

  <div class="container">
    <div class="panel">
      <div class="controls">
        <div>
          <label for="symbol">Symbol</label>
          <select id="symbol" size="1">
            <option value="">Select Stock</option>
            <option value="BSP">BSP</option>
            <option value="CCP">CCP</option>
            <option value="CGA">CGA</option>
            <option value="CPL">CPL</option>
            <option value="KAM">KAM</option>
            <option value="KSL">KSL</option>
            <option value="NEM">NEM</option>
            <option value="NGP">NGP</option>
            <option value="NIU">NIU</option>
            <option value="SST">SST</option>
            <option value="STO">STO</option>
          </select>
        </div>
        <div>
          <label for="start">Start date</label>
          <input type="date" id="start" />
        </div>
        <div>
          <label for="end">End date</label>
          <input type="date" id="end" />
        </div>
        <div>
          <button id="load" class="primary">Load chart</button>
        </div>
      </div>
      <div id="status"></div>
      <div id="chart"></div>
      <div class="footer">
        Site created by Neo Malesa. Data from the public API <a href="https://github.com/chrisaugu/pngx-api" target="_blank" rel="noreferrer">NUKU API</a> created by <a href="https://github.com/chrisaugu" target="_blank" rel="noreferrer">Christian Augustyn</a>. No warranties.
      </div>
    </div>
  </div>

  <script>
    // 1) Use documented host
    const BASE = 'https://nuku1-btlxx2lu.b4a.run/api/v2';

    // Retry/timeout tuning. The NUKU API runs on a free container tier that
    // sleeps when idle and cold-starts on the next request, so transient
    // 502/503/504s and slow first responses are expected. We retry those.
    const RETRY_TIMEOUTS_MS = [15000, 20000, 25000]; // one entry per attempt; length = max attempts
    const RETRY_BASE_DELAY_MS = 800;                  // backoff base; grows exponentially with jitter
    const CACHE_PREFIX = 'pngx-ohlc:';
    const CACHE_TTL_MS = 24 * 60 * 60 * 1000;         // serve cached data up to 24h old on failure

    const selSymbol = document.getElementById('symbol');
    const inpStart  = document.getElementById('start');
    const inpEnd    = document.getElementById('end');
    const btnLoad   = document.getElementById('load');
    const statusEl  = document.getElementById('status');
    const chartEl   = document.getElementById('chart');

    const fmt = (d)=> new Date(d.getFullYear(), d.getMonth(), d.getDate()).toISOString().slice(0,10); // guard TZ
    function setStatus(msg){ statusEl.textContent = msg || ''; }
    const sleep = (ms)=> new Promise(res => setTimeout(res, ms));

    (function initDates(){
      const end = new Date();
      const start = new Date();
      start.setDate(end.getDate() - 30);
      inpStart.value = fmt(start);
      inpEnd.value   = fmt(end);
    })();

    // 2) Fetch with timeout to avoid hanging UI
    async function fetchWithTimeout(url, ms = 15000) {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), ms);
      try {
        const resp = await fetch(url, {
          cache: 'no-store',
          signal: controller.signal,
          headers: { 'Accept': 'application/json' }
        });
        return resp;
      } finally {
        clearTimeout(id);
      }
    }

    // A failure we should retry: network error, timeout, or a transient 5xx.
    // Anything else (e.g. 400/404) is permanent — fail fast, don't retry.
    function isTransient(err){
      if (err && err.name === 'AbortError') return true;     // timed out
      if (err instanceof TypeError) return true;             // network/CORS failure
      if (err && typeof err.status === 'number') return [502, 503, 504].includes(err.status);
      return false;
    }

    // localStorage cache so an outage degrades to "stale data" instead of a blank chart.
    function cacheKey(symbol, start, end){ return `${CACHE_PREFIX}${symbol}|${start}|${end}`; }
    function writeCache(symbol, start, end, series){
      try {
        localStorage.setItem(cacheKey(symbol, start, end), JSON.stringify({ at: Date.now(), series }));
      } catch (_) { /* quota/full or disabled — caching is best-effort */ }
    }
    function readCache(symbol, start, end){
      try {
        const raw = localStorage.getItem(cacheKey(symbol, start, end));
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (!parsed || !Array.isArray(parsed.series)) return null;
        if (Date.now() - parsed.at > CACHE_TTL_MS) return null;
        // Revive x back into Date objects (JSON serialized them to strings).
        const series = parsed.series.map(p => ({ x: new Date(p.x), y: p.y }));
        return { at: parsed.at, series };
      } catch (_) { return null; }
    }

    // Fire-and-forget warm-up so the container is likely awake before the first click.
    function warmUp(){
      fetchWithTimeout(`${BASE}/historicals/BSP?start=2024-01-01&end=2024-01-02`, 25000).catch(()=>{});
    }

    async function fetchOHLCOnce(symbol, start, end, timeoutMs){
      const url = `${BASE}/historicals/${encodeURIComponent(symbol)}?start=${start}&end=${end}`;
      const r = await fetchWithTimeout(url, timeoutMs);
      if (r.status === 204) return [];
      if (!r.ok) {
        const e = new Error(`HTTP ${r.status}`);
        e.status = r.status;
        throw e;
      }
      // Cold-start splash/error pages come back as HTML, not JSON — treat as transient.
      let data;
      try {
        data = await r.json();
      } catch (_) {
        const e = new Error('Invalid response (not JSON)');
        e.status = 503;
        throw e;
      }
      if(!Array.isArray(data)) return [];
      return data
        .map(d => ({ t: d && (d.t || d.time || d.date), o: num(d && d.o), h: num(d && d.h), l: num(d && d.l), c: num(d && d.c) }))
        .filter(d => isFinite(d.o) && isFinite(d.h) && isFinite(d.l) && isFinite(d.c) && d.t)
        .map(d => ({ x: new Date(d.t), y: [d.o, d.h, d.l, d.c] }));
    }

    async function fetchOHLC(symbol, start, end, onAttempt){
      const maxAttempts = RETRY_TIMEOUTS_MS.length;
      let lastErr;
      for (let attempt = 1; attempt <= maxAttempts; attempt++){
        try {
          if (onAttempt && attempt > 1) onAttempt(attempt, maxAttempts);
          return await fetchOHLCOnce(symbol, start, end, RETRY_TIMEOUTS_MS[attempt - 1]);
        } catch (err) {
          lastErr = err;
          if (!isTransient(err) || attempt === maxAttempts) throw err;
          // Exponential backoff with jitter before the next attempt.
          const delay = RETRY_BASE_DELAY_MS * Math.pow(2, attempt - 1) * (0.5 + Math.random());
          await sleep(delay);
        }
      }
      throw lastErr;
    }

    function num(x){
      const n = typeof x === 'string' ? Number(x) : x;
      return Number.isFinite(n) ? n : NaN;
    }

    function formatAge(ms){
      const mins = Math.round(ms / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return `${mins} min ago`;
      const hrs = Math.round(mins / 60);
      return `${hrs} hr${hrs === 1 ? '' : 's'} ago`;
    }

    let chart;
    function ensureChart(){
      if(chart) return chart;
      const options = {
        chart: { type: 'candlestick', height: 520, animations: { enabled: false }, toolbar: { show: true } },
        theme: { mode: 'dark' },
        series: [{ name: 'OHLC', data: [] }],
        xaxis: { type: 'datetime' },
        yaxis: { tooltip: { enabled: true } },
        noData: { text: 'No data' },
        tooltip: { shared: false }
      };
      chart = new ApexCharts(chartEl, options);
      chart.render();
      return chart;
    }

    function daysBetween(isoStart, isoEnd){
      const s = new Date(isoStart + 'T00:00:00Z');
      const e = new Date(isoEnd   + 'T00:00:00Z');
      return Math.floor((e - s) / 86400000) + 1;
    }

    async function loadChart(){
      const symbol = selSymbol.value;
      let start    = inpStart.value;
      let end      = inpEnd.value;

      if(!symbol){ setStatus('Please select a stock symbol.'); return; }
      if(!start || !end){ setStatus('Please select a start and end date.'); return; }

      // 3) Validate and normalize dates
      if (start > end) { const t = start; start = end; end = t; }
      const span = daysBetween(start, end);
      if (span > 365) { setStatus('Range too large (>365 days). Please narrow the dates.'); return; }

      // 4) Disable button during load
      btnLoad.disabled = true; btnLoad.textContent = 'Loading…';
      setStatus(`Loading data for ${symbol}...`);
      try{
        ensureChart();
        const series = await fetchOHLC(symbol, start, end, (attempt, max)=>{
          setStatus(`API slow to respond — retrying ${attempt}/${max}…`);
        });
        if(!series.length){
          chart.updateSeries([{ name: symbol, data: [] }], true);
          setStatus(`No candles for ${symbol} in ${start} → ${end}.`);
          return;
        }
        writeCache(symbol, start, end, series);
        chart.updateSeries([{ name: symbol, data: series }], true);
        setStatus(`${symbol} · ${start} → ${end} · ${series.length} candles`);
      }catch(err){
        console.error(err);

        // Fall back to cached data so an outage isn't a blank screen.
        const cached = readCache(symbol, start, end);
        if (cached && cached.series.length){
          ensureChart();
          chart.updateSeries([{ name: symbol, data: cached.series }], true);
          setStatus(`API unavailable — showing cached data from ${formatAge(Date.now() - cached.at)}.`);
          return;
        }

        let reason;
        if (err.name === 'AbortError') reason = 'Request timed out';
        else if (err.status === 404) reason = `No data found for ${symbol}`;
        else if (err.status >= 500 || err instanceof TypeError) reason = 'API is unavailable right now';
        else reason = err.message;
        setStatus(`${reason}. `);
        showRetry();
      } finally {
        // 5) Re-enable UI
        btnLoad.disabled = false; btnLoad.textContent = 'Load chart';
      }
    }

    // Append a one-click Retry control to the status line after a failure.
    function showRetry(){
      const btn = document.createElement('button');
      btn.textContent = 'Retry';
      btn.style.cssText = 'width:auto;display:inline-block;padding:4px 12px;margin-left:8px;font-size:12px';
      btn.addEventListener('click', loadChart);
      statusEl.appendChild(btn);
    }

    btnLoad.addEventListener('click', loadChart);
    selSymbol.addEventListener('change', ()=> setStatus(selSymbol.value ? `Selected ${selSymbol.value}. Choose dates and click Load chart.` : 'Select Stock'));
    // Enter triggers a load, but not while the user is editing the date inputs.
    window.addEventListener('keydown', (e)=>{
      if (e.key !== 'Enter') return;
      if (e.target === inpStart || e.target === inpEnd) return;
      loadChart();
    });

    // Warm the sleeping container so the first real click is more likely to land fast.
    warmUp();
  </script>
</body>
</html>
